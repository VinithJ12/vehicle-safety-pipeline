version: 2

sources:
  - name: nhtsa_raw
    schema: raw
    description: Raw NHTSA flat files loaded by src/load_raw.py
    tables:
      - name: complaints
        columns:
          - name: odino
            tests: [not_null]
      - name: recalls
      - name: investigations

  - name: nlp
    schema: nlp
    description: Complaint topics produced by notebooks/02_nlp.ipynb
    tables:
      - name: complaint_topics
        columns:
          - name: complaint_id
            tests: [unique, not_null]